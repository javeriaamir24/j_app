name: j_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:

  fluttertoast: ^10.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter:
    sdk: flutter
  animated_background: ^2.0.0
  firebase_core: ^4.1.1
  firebase_auth: ^6.5.7
  firebase_database: ^12.0.2
  flutter_secure_storage: ^9.0.0
  http: ^1.6.0
  firebase_messaging: ^16.5.0
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/particles_fly.png
    - assets/images/images.jpg
    - assets/images/png-clipart-logo-idea-cute-eagle-leaf-logo-thumbnail.png
    - assets/images/171536202858347.669927576e238.webp
    - assets/images/coffee_background.webp
    - assets/images/coffee_icons.jpg
    - assets/images/coffee_themed.avif
    - assets/images/app_icon.png
